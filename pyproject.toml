[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-agent"
version = "0.1.0"
description = "Reliability-first retail after-sales agent with LangGraph, SQLite checkpoints and A/B/C evaluation."
readme = "README.md"
requires-python = ">=3.11,<3.12"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",

    "langgraph>=0.6,<2",
    "langgraph-checkpoint-sqlite>=2,<4",
    "langchain-core>=0.3,<2",
    "langchain-openai>=0.3,<2",
    "openai>=1.40,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "httpx>=0.27,<1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
retail-eval = "eval.run_eval:main"

[tool.setuptools.packages.find]
include = ["app*", "baselines*", "eval*"]
exclude = ["tests*", "data*", "reports*", "scripts*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slower concurrency or end-to-end tests",
    "integration: exercises FastAPI, LangGraph and SQLite together",
    "eval: evaluation harness tests",
    "network: requires a real model/network; skipped by default",
]

[tool.coverage.run]
source = ["app", "baselines", "eval"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".venv", "data", "reports"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "baselines", "eval"]

[tool.mypy]
python_version = "3.11"
files = ["app", "baselines", "eval"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
ignore_missing_imports = true